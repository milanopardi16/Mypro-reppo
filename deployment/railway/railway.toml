# Railway Config-as-Code (alternative to railway.json)
# Dashboard → Service → Settings → Config file path: /deployment/railway/railway.toml

[build]
builder = "NIXPACKS"
buildCommand = "npm ci --include=dev && npx prisma generate && npm run build"
nixpacksConfigPath = "deployment/railway/nixpacks.toml"
watchPatterns = [
  "server/**",
  "app/**",
  "src/**",
  "prisma/**",
  "public/**",
  "package.json",
  "package-lock.json",
  "vite.config.js",
  "prisma.config.ts"
]

[deploy]
preDeployCommand = "npx prisma migrate deploy"
startCommand = "sh deployment/railway/scripts/railway-start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
