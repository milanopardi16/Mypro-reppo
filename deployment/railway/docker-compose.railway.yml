# Local smoke-test with Railway-like settings (optional)
# Usage from repo root: docker compose -f deployment/railway/docker-compose.railway.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railway_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: deployment/railway/Dockerfile
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      SERVE_STATIC: "true"
      REG_SERVER_PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/railway_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/railway_test?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-nextauth-secret-min-32-chars!!}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-jwt-access-secret-min-32!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-jwt-refresh-secret-min-32!!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@test.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_PASSWORD_SALT: ${ADMIN_PASSWORD_SALT:-local-dev-admin-salt-min-32-chars!!}
      NEXT_PUBLIC_SITE_URL: http://localhost:4001
    depends_on:
      db:
        condition: service_healthy
