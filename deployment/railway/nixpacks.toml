# Nixpacks build plan for Railway
# Referenced by railway.json → build.nixpacksConfigPath

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
