<svg viewBox="0 0 360 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D19C0A"/>
      <stop offset="50%" stop-color="#E5B02A"/>
      <stop offset="100%" stop-color="#00B2A9"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9D9"/>
      <stop offset="100%" stop-color="#0A9B9B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#D19C0A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="42" cy="50" r="42" fill="#0A1D3D" filter="url(#shadow)"/>
  
  <!-- Outer rotating ring -->
  <g opacity="0.8">
    <circle cx="42" cy="50" r="38" fill="none" stroke="url(#logoGrad1)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="42" cy="50" r="32" fill="none" stroke="url(#logoGrad2)" stroke-width="1.2" opacity="0.3"/>
  </g>

  <!-- Central hexagon with network nodes -->
  <g filter="url(#glow)">
    <!-- Inner network dots -->
    <circle cx="42" cy="38" r="2.5" fill="#D19C0A" opacity="0.8"/>
    <circle cx="52" cy="44" r="2.5" fill="#00B2A9" opacity="0.8"/>
    <circle cx="50" cy="56" r="2.5" fill="#D19C0A" opacity="0.8"/>
    <circle cx="34" cy="56" r="2.5" fill="#00B2A9" opacity="0.8"/>
    <circle cx="32" cy="44" r="2.5" fill="#D19C0A" opacity="0.8"/>
    <circle cx="42" cy="62" r="3" fill="#00D9D9" opacity="0.9"/>
    
    <!-- Network lines connecting dots -->
    <line x1="42" y1="38" x2="52" y2="44" stroke="url(#logoGrad1)" stroke-width="1.2" opacity="0.5"/>
    <line x1="52" y1="44" x2="50" y2="56" stroke="url(#logoGrad2)" stroke-width="1.2" opacity="0.5"/>
    <line x1="50" y1="56" x2="42" y2="62" stroke="url(#logoGrad1)" stroke-width="1.2" opacity="0.5"/>
    <line x1="42" y1="62" x2="34" y2="56" stroke="url(#logoGrad2)" stroke-width="1.2" opacity="0.5"/>
    <line x1="34" y1="56" x2="32" y2="44" stroke="url(#logoGrad1)" stroke-width="1.2" opacity="0.5"/>
    <line x1="32" y1="44" x2="42" y2="38" stroke="url(#logoGrad2)" stroke-width="1.2" opacity="0.5"/>
    
    <!-- Central point -->
    <circle cx="42" cy="50" r="3.5" fill="url(#logoGrad1)"/>
    <circle cx="42" cy="50" r="2" fill="#0A1D3D"/>
  </g>

  <!-- Arrow/growth indicator -->
  <path d="M 32 28 L 42 18 L 52 28" stroke="url(#logoGrad1)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Company name -->
  <text x="100" y="42" font-family="Beirut, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
    Capital
  </text>
  <text x="100" y="65" font-family="Beirut, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#logoGrad1)">
    Network
  </text>

  <!-- Tagline -->
  <text x="100" y="82" font-family="Beirut, Arial, sans-serif" font-size="11" font-weight="500" fill="#00B2A9" opacity="0.8">
    شبکه سرمایه‌گذاری هوشمند
  </text>

  <!-- Accent line -->
  <line x1="100" y1="72" x2="200" y2="72" stroke="url(#logoGrad1)" stroke-width="1" opacity="0.3"/>
</svg>
