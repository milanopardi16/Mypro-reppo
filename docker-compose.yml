services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capital_network
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capital_network"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      REG_SERVER_PORT: 4001
      SERVE_STATIC: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/capital_network?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-minimum-32-characters-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-minimum-32-characters-long}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@capitalnetwork.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-strong-password}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
